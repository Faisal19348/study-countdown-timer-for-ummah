<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Countdown Timer for Ummah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Study Countdown Timer</h1>

    <div id="timer" class="timer-display">02:00:00</div>

    <div class="button-container">
        <button onclick="startTimer()">Start</button>
        <button onclick="pauseTimer()">Pause</button>
        <button onclick="resumeTimer()">Resume</button>
        <button onclick="resetTimer()">Reset</button>
    </div>

    <div class="music-bar">
        <span class="music-name">Surah Al-Baqarah — Mishary Al-Afasy</span>
        <span id="musicStatus" class="music-status">Stopped</span>
    </div>

    <audio id="audioPlayer" loop>
        <source src="https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/2.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
